name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Rebuild native modules
        run: npx electron-rebuild -f -w better-sqlite3

      - name: Build
        run: npm run build

      - name: Package Windows portable
        run: npx cross-env CSC_IDENTITY_AUTO_DISCOVERY=false electron-builder --win portable --x64
        # No GH_TOKEN here — prevents electron-builder from trying to create a release

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/*.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Rebuild native modules
        run: npx electron-rebuild -f -w better-sqlite3

      - name: Build
        run: npm run build

      - name: Package macOS
        run: npx electron-builder --mac dmg --x64 --arm64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: release/*.dmg

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Rebuild native modules
        run: npx electron-rebuild -f -w better-sqlite3

      - name: Build
        run: npm run build

      - name: Package Linux
        run: npx electron-builder --linux AppImage --x64

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: release/*.AppImage

  publish:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: artifacts

      - uses: actions/download-artifact@v4
        with:
          name: macos
          path: artifacts

      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: artifacts

      - name: Upload to existing Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
