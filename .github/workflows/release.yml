name: Build and Release

# Trigger: push a tag like v1.2.3
# One command to release everything:
#   git tag v1.2.3 && git push origin v1.2.3

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  # ── Build on each platform in parallel ─────────────────────────────────────
  build:
    strategy:
      fail-fast: false   # don't cancel other platforms if one fails
      matrix:
        include:
          - os: windows-latest
            platform: windows
            build_cmd: npx cross-env CSC_IDENTITY_AUTO_DISCOVERY=false electron-builder --win nsis portable --x64
            artifact_glob: 'release/*.exe'

          - os: macos-latest
            platform: macos
            build_cmd: npx electron-builder --mac dmg --x64 --arm64
            artifact_glob: 'release/*.dmg'
            env_extra: |
              CSC_IDENTITY_AUTO_DISCOVERY=false
              ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES=true

          - os: ubuntu-latest
            platform: linux
            build_cmd: npx electron-builder --linux AppImage deb --x64
            artifact_glob: 'release/*.{AppImage,deb}'

    runs-on: ${{ matrix.os }}
    name: Build · ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # Linux needs extra libs for Electron
      - name: Install Linux build deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libnotify-dev libnss3 libxss1 \
            libasound2t64 libxtst6 xauth xvfb

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Rebuild native modules
        run: npx electron-rebuild -f -w better-sqlite3

      - name: Build (Vite + TypeScript)
        run: npm run build

      - name: Package — ${{ matrix.platform }}
        run: ${{ matrix.build_cmd }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true
          # Don't let electron-builder auto-publish — we handle it below
          GH_TOKEN: ''

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          # Collect all release binaries, skip yml/yaml config files
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: warn

  # ── Create GitHub Release and attach all binaries ──────────────────────────
  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: always() && needs.build.result != 'cancelled'

    steps:
      - name: Checkout (for package.json version check)
        uses: actions/checkout@v4

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME}"
          echo "package.json: $PKG_VERSION"
          echo "git tag:      $TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          # Downloads each platform into artifacts/windows/, artifacts/macos/, etc.

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          name: "MailShelf ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          # Draft if any platform failed — won't show as "latest" until manually published
          draft: ${{ needs.build.result != 'success' }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.AppImage
            artifacts/**/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
